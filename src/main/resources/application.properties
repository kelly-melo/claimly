spring.application.name=claimly

spring.datasource.url=jdbc:postgresql://localhost:5432/claimly
spring.datasource.username=${DB_USER:claimly}
spring.datasource.password=${DB_PASSWORD:claimly}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

tesseract.idioma=por
tesseract.datapath=${TESSDATA_PREFIX:}

groq.api-key=${GROQ_API_KEY:}
groq.modelo=${GROQ_MODEL:openai/gpt-oss-120b}
groq.url-base=https://api.groq.com/openai/v1
